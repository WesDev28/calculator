<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Calculator</title>
    <link rel = "stylesheet" href="./style.css">
    <script src = "./calculator.js" defer></script>


</head>

<body>

    <div class="header">calculator.js</div>

    <div class = "calculatorDiv">
        <div id="screen"></div>
        
        <div id="upperDisplay">
        <div id = "digits">
            <button id="decimal">.</button>
            <button id="zero">0</button>
            <button id="one">1</button>
            <button id="two">2</button>
            <button id="three">3</button>
            <button id="four">4</button>
            <button id="five">5</button>
            <button id="six">6</button>
            <button id="seven">7</button>
            <button id="eight">8</button>
            <button id="nine">9</button>
        </div>

        <div id = "backspace">
            <button id="backspaceButton">&#9003</button>        
        </div>
        </div>

        <div id="operators">
            <button id ="add">+</button>
            <button id ="subtract">-</button>
            <button id ="multiply"><span>&#215</span></button>
            <button id ="divide"><span>&#247</span></button>
        </div>
        
        <div id ="equals">
            <button id ="equalsButton">=</button>
        </div>
        
        <div id="clear">
            <button id ="clearButton">clear</button>
        </div>
    
    </div>

</body>


</html>
